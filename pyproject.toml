[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "braidpy"
version = "0.3.0"
description = "Python library for working with braids"
authors = [
    { name="Baptiste Labat", email="baptiste.labat@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "MPL-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# What braids are made of and how they are worked out.  Drawing them is an
# extra (viz), so that braidpy alone installs small.
dependencies = [
    "numpy>=1.21.0",
    "sympy>=1.14.0",
    "math-braid (>=0.8,<0.9)",
    "dataclasses-json>=0.6.7",
    "networkx>=3.4.2",
]

[project.optional-dependencies]
# Drawing braids: diagrams, 3D plots, animations (braid.plot,
# ParametricBraid.plot, the machines' and disks' animations).
viz = [
    "matplotlib>=3.7.5",
    "plotly>=6.1.2",
    "imageio>=2.37.2",
]
# braidpy as an MCP server, for AI assistants (braidpy.mcp_server).
mcp = ["mcp>=2"]

[project.scripts]
braidpy-mcp = "braidpy.mcp_server:main"

[dependency-groups]
dev = [
    # Working on braidpy, its drawings are tested too.
    "braidpy[viz]",
    "ruff>=0.11.11",
    "pytest>=8.3.5",
    "coverage>=7.8.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "myst-parser>=4.0.1",
    "myst>=1.0.4",
    "monkeytype>=23.3.0",
    "mypy>=1.16.0",
    "pytest-xdist>=3.6",
    "pytest-testmon>=2.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: takes seconds or minutes; left out of the quick run (make test), run daily and by make test-all",
]

[tool.setuptools.package-data]
braidpy = ["py.typed"]

[tool.mypy]
# Libraries without type information.
[[tool.mypy.overrides]]
module = ["math_braid.*", "mpl_toolkits.*", "networkx.*", "plotly.*", "sympy.*"]
ignore_missing_imports = true
