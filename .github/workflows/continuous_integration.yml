name: Continuous integration
run-name: ${{ github.actor }} is using out GitHub Actions 🚀

# On every push, the quick tests: all but those marked slow, in parallel, on
# the newest Python — a couple of minutes.  Every day, and on demand,
# everything: the slow tests too, on every Python supported.
on:
  push:
  schedule:
    # Daily, on the default branch (develop).
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  quick:
    name: continuous-integration (quick, 3.15)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run the quick tests
        run: make test

      - name: Check types
        run: make typecheck

      - name: Check for duplicated code
        run: make duplicates

  full:
    name: continuous-integration
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    strategy:
      # Each Python's result in full, rather than the rest stopped by one.
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run every test
        run: make test-all

      - name: Check types
        run: make typecheck

      - name: Check for duplicated code
        run: make duplicates
