name: Release
run-name: Release ${{ github.ref_name }} to PyPI

# A version tag pushed (0.3.0, 1.2.10…) builds braidpy and publishes it on
# PyPI, by PyPI's trusted publishing: no token is kept anywhere.  On PyPI,
# braidpy's trusted publisher names this repository, this workflow
# (release.yml) and the environment "production".

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The tag is the version pyproject.toml gives, or nothing is published.
      - name: Check the tag is the version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but pyproject.toml says $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the package
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://pypi.org/project/braidpy/${{ github.ref_name }}/
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
