"A core goes down the hole a ring of gears encloses, unless the machine has cores of its own." = "Une âme descend par le trou qu'entoure un anneau de poupées arbrées, sauf si la machine a ses propres âmes."
"A core down the disk's middle, the braid made round it: on a marudai, it rises up the braid's axis and each move passes beside it." = "Une âme au milieu du disque, la tresse faite autour : sur un marudai, elle monte le long de l'axe de la tresse et chaque mouvement passe à côté."
