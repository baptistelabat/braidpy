"Describe a braid — a braid word, a kumihimo pattern, a disk braid, an Ashley sinnet, a braiding machine or a lace machine — and see it laid and tightened in 3D, computed by {} in your browser." = "Décrivez une tresse — un mot de tresse, un motif de kumihimo, une tresse sur disque, une tresse d'Ashley, une machine à tresser ou une machine à dentelle — et voyez-la posée et serrée en 3D, calculée par {} dans votre navigateur."
