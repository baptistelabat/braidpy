"not used on a marudai" = "inutile sur un marudai"
"Tightening steps" = "Étapes de serrage"
"0 lays the yarns with no tension. The marudai draws its yarns tight itself, without these." = "0 pose les fils sans tension. Le marudai serre ses fils lui-même, sans elles."
"Settle the yarns" = "Tasser les fils"
"On a marudai: move by move, each yarn laid over and drawn tight" = "Sur un marudai : mouvement par mouvement, chaque fil posé par-dessus et serré"
"Sideways: fast, keeps the laid pitch" = "De côté : rapide, garde le pas de pose"
"Sideways, endless: its fell end running on into its top, as a length cut from a longer braid" = "De côté, sans fin : son bout au point de tressage se poursuivant dans son haut, comme un morceau coupé d'une tresse plus longue"
"Physics: beaten up until it jams (beta)" = "Physique : tassée jusqu'à se bloquer (bêta)"
"Physics: made crossing by crossing, with friction, then settled (beta)" = "Physique : faite croisement par croisement, avec frottement, puis tassée (bêta)"
"By its carriers: each pulling its yarn through a forming ring, to scale (beta)" = "Par ses fuseaux : chacun tirant son fil à travers un anneau de formage, à l'échelle (bêta)"
"The marudai takes disk braids, braid words and lace machines; physics, any braid but one round rigid cores; its carriers, a machine's braid." = "Le marudai prend les tresses sur disque, les mots de tresse et les machines à dentelle ; la physique, toute tresse sauf autour d'âmes rigides ; ses fuseaux, la tresse d'une machine."
"Twist" = "Torsion"
"Kept: the braid held, never turning; turning the bobbins twists the yarns in" = "Gardée : la tresse tenue, sans jamais tourner ; tourner les bobines tord les fils"
"Held while every bobbin turns together, hanging free otherwise" = "Tenue pendant que toutes les bobines tournent ensemble, pendant librement sinon"
"Untwisted: the braid hanging free, turning as its yarns pull it" = "Détordue : la tresse pendant librement, tournant comme ses fils la tirent"
"Each braid's own is marked \"default\". On a marudai, untwisted, the bobbins turning together carry the braid round with them: a rope's twist comes straight back out. Settled by physics, the end the braid is drawn off by is held or turns. Tightened sideways, endless or not, the yarns keep the twist they were laid with." = "Celle de chaque tresse est marquée « par défaut ». Sur un marudai, détordue, les bobines tournant ensemble entraînent la tresse avec elles : la torsion d'une corde ressort aussitôt. Tassée par la physique, le bout par lequel on tire la tresse est tenu ou tourne. Serrés de côté, sans fin ou non, les fils gardent la torsion avec laquelle ils ont été posés."
