"Give a strand its own colour and it changes everywhere it is drawn. Strands of one colour are a group: change the group's colour and they all change; give a strand a group's colour and it joins it. Ctrl- or Shift-click strands to colour several at once." = "Donnez sa couleur à un brin et il change partout où il est dessiné. Les brins d'une même couleur forment un groupe : changez la couleur du groupe et ils changent tous ; donnez à un brin la couleur d'un groupe et il le rejoint. Ctrl- ou Maj-clic sur des brins pour en colorer plusieurs à la fois."
