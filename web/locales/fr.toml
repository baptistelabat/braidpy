# The page in French: each text braidpy shows, by its English (see
# web/i18n.js).  "{}" stands for any words, themselves looked up, "{#}" for
# a number; a translation takes them in turn, or as "{1}", "{2}"…
#
# Words used throughout: braid tresse, strand brin, yarn fil, carrier
# fuseau, bobbin bobine, gear poupée arbrée, slot (of a disk) fente, slot (of a
# gear) encoche, notch cran, space (Ashley's) espace, move mouvement, core
# âme, card carton, fell point de tressage, sinnet tresse.

# The language's own name, in the page's menu.
"English" = "Français"
"Language" = "Langue"

