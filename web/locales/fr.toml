"How many" = "Combien"
"Repeat" = "Répéter"
"Moves" = "Mouvements"
"S swaps the top and bottom strands, R turns the disk a quarter." = "S échange les brins du haut et du bas, R tourne le disque d'un quart."
"Strands start in slots" = "Les brins partent des fentes"
"One slot per strand; slots are numbered clockwise from the top." = "Une fente par brin ; les fentes sont numérotées dans le sens horaire depuis le haut."
"Moves, in order" = "Mouvements, dans l'ordre"
"From slot > to slot, for example 1>15, 17>31. A strand goes the short way round, over the strands it passes. Change them, here or on the disk, to make your own braid: the one chosen stays as it is." = "De la fente > à la fente, par exemple 1>15, 17>31. Un brin fait le tour par le plus court, par-dessus les brins qu'il passe. Changez-les, ici ou sur le disque, pour faire votre propre tresse : celle choisie reste telle quelle."
"Slots" = "Fentes"
"Turn after a cycle" = "Tour après un cycle"
"Cycles" = "Cycles"
"Import a braid3d design" = "Importer un dessin braid3d"
"A .b3d file saved by braid3d, read as your own disk braid: its yarns, in their colours, and its moves, on a disk of as few slots as hold them." = "Un fichier .b3d enregistré par braid3d, lu comme votre propre tresse sur disque : ses fils, dans leurs couleurs, et ses mouvements, sur un disque d'aussi peu de fentes qu'il en faut."
"Sinnet" = "Tresse"
"Strands in each space" = "Brins dans chaque espace"
"Spaces are numbered anticlockwise from the top, as the top view shows them: the first and the last meet there." = "Les espaces sont numérotés dans le sens antihoraire depuis le haut, comme les montre la vue de dessus : le premier et le dernier s'y rejoignent."
"From space > to space. Odd spaces send their right-hand strand anticlockwise, even spaces their left-hand one clockwise, over all." = "De l'espace > à l'espace. Les espaces impairs envoient leur brin de droite dans le sens antihoraire, les pairs celui de gauche dans le sens horaire, par-dessus tout."
"Grid" = "Grille"
"Shape" = "Forme"
"Cells" = "Cellules"
"The shape's own cells, changed by clicking on the drawing: i,j a square, or a rhomb on the skewed grid; on the diamond grid, i,jb, i,jr, i,jt, i,jl the quarter of that square below, right of, above or left of its middle; i,j^ the triangle pointing up from point i,j, i,jv the one down beside it. Empty, the shape chosen. A hole is a hole once a point of the grid is left out, Ashley's lines running through the points." = "Les cellules de la forme, changées en cliquant sur le dessin : i,j un carré, ou un losange sur la grille en biais ; sur la grille en losange, i,jb, i,jr, i,jt, i,jl le quart de ce carré en dessous, à droite, au-dessus ou à gauche de son milieu ; i,j^ le triangle pointant vers le haut depuis le point i,j, i,jv celui vers le bas à côté. Vide, la forme choisie. Un trou est un trou dès qu'un point de la grille est laissé de côté, les lignes d'Ashley passant par les points."
"Order of the moves" = "Ordre des mouvements"
"Tracks turned round" = "Parcours inversés"
"Each track's moves made the other way round, by number." = "Les mouvements de chaque parcours faits dans l'autre sens, par numéro."
"A strand more in spaces" = "Un brin de plus dans les espaces"
"Each space named holds a strand more from the start, twice named two." = "Chaque espace nommé a un brin de plus dès le départ, nommé deux fois deux."
"Size" = "Taille"
"Lines along each side; an oblong's, an L's, a U's or a hollow square's width." = "Lignes le long de chaque côté ; la largeur d'un rectangle, d'un L, d'un U ou d'un carré creux."
"Height" = "Hauteur"
"An oblong's height, or how thick an L's or a U's arms or a hollow square's sides are, in lines." = "La hauteur d'un rectangle, ou l'épaisseur des bras d'un L ou d'un U ou des côtés d'un carré creux, en lignes."
"At each corner" = "À chaque coin"
"Strands more in each space at a corner, or alone on a side, as the book sharpens a triangle's edges (#3049) or a flat oblong's (#3072)." = "Des brins de plus dans chaque espace à un coin, ou seul sur un côté, comme le livre aiguise les arêtes d'un triangle (n° 3049) ou d'un rectangle plat (n° 3072)."
"Machine" = "Machine"
"Gears that mesh" = "Poupées arbrées qui engrènent"
"Each pair of gears that mesh, as A-B: A-B B-C C-D D-A is four gears in a ring. A gear with its own number of slots is written A:6 wherever it is named. A split gear is written as its parts, each meshing with its own neighbours, joined on their axle: A-B1 B2-C B1+B2 is two plaits side by side, B split in two; a gear may be split in more parts, as H1+H2+H3. Neighbours turn opposite ways, so a ring of an odd number of gears cannot turn. Starts from the machine chosen before." = "Chaque paire de poupées arbrées qui engrènent, comme A-B : A-B B-C C-D D-A est quatre poupées arbrées en anneau. Une poupée arbrée avec son propre nombre d'encoches s'écrit A:6 partout où elle est nommée. Une poupée arbrée divisée s'écrit comme ses parties, chacune engrenant avec ses propres voisines, jointes sur leur axe : A-B1 B2-C B1+B2 est deux tresses côte à côte, B divisée en deux ; une poupée arbrée peut être divisée en plus de parties, comme H1+H2+H3. Des voisines tournent en sens contraires, donc un anneau d'un nombre impair de poupées arbrées ne peut pas tourner. Part de la machine choisie avant."
"Slots per gear" = "Encoches par poupée arbrée"
"Carriers" = "Fuseaux"
"Each as gear:slot, slots numbered from each gear's first. Click a slot on the machine to put a carrier on it or take it off: carriers that meet stop the braiding there." = "Chacun comme poupée arbrée:encoche, les encoches numérotées depuis la première de chaque poupée arbrée. Cliquez sur une encoche de la machine pour y mettre un fuseau ou l'enlever : des fuseaux qui se rencontrent arrêtent le tressage là."
"Axial yarns" = "Fils axiaux"
"Where straight yarns are fed up through the braid, the carriers braiding round them: a gear, as B, up its hollow spindle; the ring of gears round a hole, as A-B-C-D, down it. Every place there is room for one is marked on the machine: click one to load a spool there or take it off." = "Où des fils droits montent à travers la tresse, les fuseaux tressant autour : une poupée arbrée, comme B, par son axe creux ; l'anneau de poupées arbrées autour d'un trou, comme A-B-C-D, par ce trou. Chaque place où il y en a la place est marquée sur la machine : cliquez dessus pour y charger une bobine ou l'enlever."
"Lace machine" = "Machine à dentelle"
"Gears" = "Poupées arbrées"
"Punchcard" = "Carton perforé"
"The gears each step turns, a step after another with / between, for example A C / B / -: A, C, E… turn anticlockwise, first, then B, D, F… clockwise; - is a step turning none, and after Z come AA, AB… Or a step a line in 0 and 1, a digit a gear from A: the gears turning anticlockwise, then those turning clockwise, for example 1010 0100. Change it to make your own: the one chosen stays as it is." = "Les poupées arbrées que chaque pas fait tourner, un pas après l'autre séparés par /, par exemple A C / B / - : A, C, E… tournent dans le sens antihoraire, d'abord, puis B, D, F… dans le sens horaire ; - est un pas qui n'en fait tourner aucune, et après Z viennent AA, AB… Ou un pas par ligne en 0 et 1, un chiffre par poupée arbrée depuis A : celles tournant dans le sens antihoraire, puis celles tournant dans le sens horaire, par exemple 1010 0100. Changez-le pour faire le vôtre : celui choisi reste tel quel."
"Bobbins" = "Bobines"
"Each as gear:slot, or by its notch, A-B, as the card names them. A bobbin sits in a notch, where two gears overlap: click one on the machine to put a bobbin in it or take it off. The card turns the gears; bobbins that meet stop the braiding there." = "Chacune comme poupée arbrée:encoche, ou par son cran, A-B, comme le carton les nomme. Une bobine se loge dans un cran, là où deux poupées arbrées se chevauchent : cliquez sur l'un d'eux sur la machine pour y mettre une bobine ou l'enlever. Le carton fait tourner les poupées arbrées ; des bobines qui se rencontrent arrêtent le tressage là."
"Passes of the card" = "Passages du carton"
"Your own…" = "La vôtre…"
